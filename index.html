<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borewell Telemetry Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- SheetJS Library for Excel Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>Borewell Main Page Dashboard</h2>

    <!-- Login Controls Card -->
    <div class="card">
      <div class="form-group">
        <label for="apiUser">Username:</label>
        <input type="text" id="apiUser" placeholder="Enter Forbes Marshall Username">
      </div>

      <div class="form-group">
        <label for="apiPass">Password:</label>
        <input type="password" id="apiPass" placeholder="Enter Forbes Marshall Password">
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Save for future</label>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" onclick="runMacroLogic()">▶ Run Macro</button>
        <button class="btn btn-secondary" onclick="clearCredentials()">🗑 Clear Saved Info</button>
        <button class="btn btn-success" onclick="exportToExcel()">📥 Download Excel</button>
      </div>
      
      <p id="statusMsg" style="font-weight: bold; color: #107c41; margin-top: 10px;"></p>
    </div>

    <!-- Hidden iframe used for receiving cross-origin form submissions -->
    <iframe id="responseFrame" name="responseFrame" style="display:none;"></iframe>

    <!-- Telemetry Data Table Card -->
    <div class="card">
      <table id="excelTable">
        <thead>
          <tr>
            <th>Site Name</th>
            <th>Location</th>
            <th>Hourly Total</th>
            <th>Daily Total</th>
            <th>NOC Limit (m3/yr)</th>
            <th>NOC Limit (m3/day)</th>
            <th>Flow Rate</th>
            <th>Totalizer</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="8" style="text-align:center;">No data loaded yet. Enter credentials and click 'Run Macro'.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
