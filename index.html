<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Web App</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
    .card { background: white; padding: 25px; border-radius: 8px; max-width: 800px; margin: auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #107c41; margin-top: 0; }
    .btn { background-color: #107c41; color: white; padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; }
    .btn:hover { background-color: #0b582e; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background-color: #f0f0f0; }
  </style>
</head>
<body>

<div class="card">
  <h1>Excel Macro Web Application</h1>
  <p>Upload an Excel file or click run to test the macro logic in your browser.</p>

  <div>
    <input type="file" id="fileInput" accept=".xlsx, .xls" />
    <button class="btn" onclick="runMacroLogic()">▶ Run Macro</button>
    <button class="btn" onclick="exportToExcel()">📥 Download Result</button>
  </div>

  <table id="excelTable">
    <thead>
      <tr>
        <th>Item ID</th>
        <th>Item Name</th>
        <th>Value</th>
        <th>Result (Calculated)</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr>
        <td>101</td>
        <td>Sample Product A</td>
        <td>150</td>
        <td>-</td>
      </tr>
      <tr>
        <td>102</td>
        <td>Sample Product B</td>
        <td>250</td>
        <td>-</td>
      </tr>
    </tbody>
  </table>
</div>

<script src="app.js"></script>
</body>
</html>
